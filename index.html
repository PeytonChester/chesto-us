<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // iOS Safari zooms in when focusing a form field with text under 16px.
      // maximum-scale=1 stops that auto-zoom; since iOS 10 Safari ignores it
      // for pinch-zoom, so people can still zoom. Android would block pinch
      // with it, so apply it on iOS only (iPadOS reports itself as a Mac).
      if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1')
      }
    </script>
    <meta name="description" content="Chesto.us — Photography, recipes, and stories." />
    <title>Chesto.us | Photography, Recipes &amp; Stories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights in use; loaded without blocking the first paint -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@400;500&family=DM+Mono&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@400;500&family=DM+Mono&display=swap" /></noscript>
    <script>
      // Start downloading the home page hero right away instead of after the
      // app and Firestore load. Must match HERO_SRCSET/HERO_SIZES in src/lib/images.js.
      if (location.pathname === '/') {
        var hero = document.createElement('link')
        hero.rel = 'preload'
        hero.as = 'image'
        hero.href = '/api/hero?w=1080'
        hero.setAttribute('imagesrcset', [640, 1080, 1920, 2560, 3840].map(function (w) { return '/api/hero?w=' + w + ' ' + w + 'w' }).join(', '))
        hero.setAttribute('imagesizes', '(max-width: 768px) 360px, 100vw')
        hero.setAttribute('fetchpriority', 'high')
        document.head.appendChild(hero)
      }
    </script>
  </head>
  <body>
    <!-- Home hero photo and backdrop, painted before any JS runs and kept on
         screen afterwards: React renders the hero text over it (see Home.jsx)
         instead of replacing the image, so the LCP image isn't redrawn. -->
    <div id="hero-bg" class="absolute top-0 inset-x-0 h-screen overflow-hidden bg-chesto-dark" hidden aria-hidden="true">
      <img
        id="hero-bg-img"
        alt=""
        fetchpriority="high"
        class="w-full h-full object-cover"
        style="opacity: 0"
        onload="this.style.opacity = '0.6'"
        onerror="this.remove(); window.dispatchEvent(new Event('hero-bg-error'))"
      />
      <div class="absolute inset-0 bg-gradient-to-t from-chesto-dark via-chesto-dark/20 to-transparent"></div>
    </div>
    <script>
      // Only load it on the home page. Same srcset/sizes as the preload above
      // and HERO_SRCSET/HERO_SIZES in src/lib/images.js.
      if (location.pathname === '/') {
        var heroImg = document.getElementById('hero-bg-img')
        heroImg.setAttribute('sizes', '(max-width: 768px) 360px, 100vw')
        heroImg.setAttribute('srcset', [640, 1080, 1920, 2560, 3840].map(function (w) { return '/api/hero?w=' + w + ' ' + w + 'w' }).join(', '))
        heroImg.setAttribute('src', '/api/hero?w=1080')
        document.getElementById('hero-bg').hidden = false
      }
    </script>
    <div id="root">
      <!-- Static copy of the home page's first screen (over #hero-bg), painted
           before the app's JS loads; React replaces everything inside #root on
           start. Shown on / only. Keep in sync with the hero in
           src/pages/Home.jsx and the header in src/components/Layout.jsx. -->
      <div id="boot-home" hidden>
        <header class="fixed top-0 inset-x-0 z-40">
          <nav class="max-w-7xl mx-auto px-6 md:px-10 h-16 flex items-center justify-between">
            <a href="/" class="font-display font-semibold text-xl tracking-tight text-chesto-cream">Chesto<span class="text-chesto-gold">.</span>us</a>
            <span class="md:hidden flex flex-col gap-1.5 p-2" aria-hidden="true">
              <span class="block w-6 h-px bg-white"></span><span class="block w-6 h-px bg-white"></span><span class="block w-6 h-px bg-white"></span>
            </span>
          </nav>
        </header>
        <section class="relative min-h-screen flex items-end pb-20 overflow-hidden">
          <div class="relative max-w-7xl mx-auto px-6 md:px-10 w-full">
            <p id="boot-tagline" class="section-label text-chesto-gold/80 mb-4">Welcome to the party</p>
            <h1 id="boot-heading" class="font-display font-semibold text-5xl md:text-7xl text-chesto-cream leading-[1.05] mb-8 max-w-2xl">Photography.<br />Food. Life.</h1>
            <div class="flex flex-wrap gap-4">
              <a href="/photography" class="btn-gold">View Photography</a>
              <a href="/recipes" class="inline-flex items-center gap-2 px-6 py-3 border border-chesto-cream/30 text-chesto-cream font-body font-medium text-sm tracking-wider uppercase">Browse Recipes</a>
            </div>
          </div>
        </section>
      </div>
      <script>
        if (location.pathname === '/') {
          // Use the hero text from the last visit, if the site saved it
          try {
            var saved = JSON.parse(localStorage.getItem('chesto-hero') || 'null')
            if (saved) {
              var tagline = document.getElementById('boot-tagline')
              if (saved.tagline) tagline.textContent = saved.tagline
              else tagline.remove()
              if (saved.heading) {
                var h1 = document.getElementById('boot-heading')
                h1.textContent = ''
                saved.heading.split('\n').forEach(function (line, i) {
                  if (i) h1.appendChild(document.createElement('br'))
                  h1.appendChild(document.createTextNode(line))
                })
              }
            }
          } catch (e) {}
          document.getElementById('boot-home').hidden = false
        }
      </script>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
